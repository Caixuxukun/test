name: Build KosmicKrisp iOS dylib

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitlab-ci/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'Target iOS Version'
        required: true
        default: '26.0'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build KosmicKrisp (iOS ${{ inputs.ios_version || '26.0' }} arm64)
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "${XCODE_APP}" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcrun --sdk iphoneos --show-sdk-path
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK version: ${SDK_VER}"
          if [ "${SDK_VER%%.*}" -lt 26 ]; then
            echo "::error::iPhoneOS SDK ${SDK_VER} is too old; KosmicKrisp needs the iOS 26 SDK (Metal 4)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install --force-bottle llvm libclc spirv-llvm-translator spirv-tools pkg-config ninja cmake
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG=/opt/homebrew/bin/pkg-config" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:/opt/homebrew/opt/openssl/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV

          pip install --upgrade meson mako pyyaml packaging

          echo "==> Host toolchain versions:"
          /opt/homebrew/opt/llvm/bin/llvm-config --version
          pkg-config --modversion LLVMSPIRVLib || true
          pkg-config --modversion SPIRV-Tools || true
          meson --version

      - name: Build KosmicKrisp Standalone dylib
        run: |
          chmod +x ./build_kosmickrisp_ios.sh
          IOS_TARGET_VERSION="${{ inputs.ios_version || '26.0' }}" ./build_kosmickrisp_ios.sh

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kosmickrisp-build-logs
          path: |
            build-host-tools/meson-logs/
            build-ios-arm64/meson-logs/
            build-ios-arm64/.ninja_log
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect and Verify Binary
        run: |
          DYLIB="build-ios-arm64/src/kosmickrisp/vulkan/libvulkan_kosmickrisp.dylib"
          echo "==> File details:"
          file "${DYLIB}"

          echo "==> Architecture & Platform Load Commands:"
          otool -l "${DYLIB}" | grep -A 4 -E "(LC_BUILD_VERSION|LC_VERSION_MIN)" || true

          echo "==> Linked Frameworks / Libraries:"
          otool -L "${DYLIB}"

          echo "==> Exported Vulkan Symbols:"
          nm -gU "${DYLIB}" | grep -E "_(vkGetInstanceProcAddr|vkCreateInstance|vk_icdGetInstanceProcAddr)" || true

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          DYLIB="build-ios-arm64/src/kosmickrisp/vulkan/libvulkan_kosmickrisp.dylib"
          cp "${DYLIB}" dist/libvulkan_kosmickrisp.dylib
          cp "${DYLIB}" dist/libvulkan.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KosmicKrisp-iOS-${{ inputs.ios_version || '26.0' }}-arm64
          path: dist/
          retention-days: 14

      - name: Release (on tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/libvulkan_kosmickrisp.dylib
            dist/libvulkan.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
